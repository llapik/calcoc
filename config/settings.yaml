app:
  name: "AI PC Repair & Optimizer"
  version: "0.1.0"
  language: "ru"  # ru | en
  expert_mode: false
  web_host: "127.0.0.1"
  web_port: 8080

# Paths are relative to data_dir unless absolute.
# data_dir "auto": ~/.local/share/calcoc (Linux), %LOCALAPPDATA%\\calcoc (Windows),
# /mnt/usb_data when booted from the USB stick. Override with CALCOC_DATA_DIR.
paths:
  data_dir: "auto"
  backup_dir: "backups"
  journal_db: "journal.db"
  telemetry_db: "telemetry.db"
  models_dir: "models"
  clamav_db: "clamav"
  knowledge_dir: "knowledge"
  logs_dir: "logs"

ai:
  backend: "llama"  # llama | openrouter | none
  temperature: 0.3
  max_tokens: 2048
  context_size: 4096

openrouter:
  api_key: ""  # set in the UI (⚙) or via OPENROUTER_API_KEY; never commit a key here
  base_url: "https://openrouter.ai/api/v1"
  # The agent needs a model with tool calling. ":free" models work on a free OpenRouter account.
  default_model: "google/gemma-4-31b-it:free"
  fallback_models:
    - "nvidia/nemotron-3.5-lightning:free"
    - "openrouter/free"

network:
  enabled: false
  allow_ai_requests: false
  update_clamav: true
  cache_responses: true
  anonymous_telemetry: false

safety:
  require_confirmation: true
  max_risk_level: "yellow"  # green | yellow | red (black always blocked)
  auto_backup: true
  cleanup_min_age_hours: 24  # desktop mode: only temp files older than this are removed
